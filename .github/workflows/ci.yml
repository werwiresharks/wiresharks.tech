name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:server
      - run: npm test
      - run: npm run build
      # build.mjs makes the public ZIP; check.mjs verifies tokens, copy, assets and the ZIP contents (needs zip/unzip)
      - run: node docs/brand/tools/build.mjs
      - run: node docs/brand/tools/check.mjs
