<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of public/og-image.jpg. Copy into dist/ after a build (fonts resolve from dist/assets), open at 1200x630, screenshot, and export as a q88 JPEG. -->
<style>
@font-face{font-family:Geist;font-weight:400;src:url(./assets/geist-latin-400-normal-B40WzpMT.woff2)}
@font-face{font-family:Geist;font-weight:600;src:url(./assets/geist-latin-600-normal-CSETrqM2.woff2)}
@font-face{font-family:"Geist Mono";font-weight:400;src:url(./assets/geist-mono-latin-400-normal-DTRLJnHl.woff2)}
html,body{margin:0;background:#0b0b0c}
#card{position:relative;width:1200px;height:630px;overflow:hidden;color:#f3f3f1;font-family:Geist;
background:radial-gradient(90% 70% at 85% -10%,#1e1f23,transparent 70%),radial-gradient(60% 60% at 0% 110%,rgba(229,37,27,.16),transparent 70%),#111214}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-size:28px;font-weight:600;letter-spacing:-.045em}
.brand span span{font-weight:400}
h1{position:absolute;left:72px;top:182px;margin:0;font-weight:400;font-size:96px;line-height:.98;letter-spacing:-.055em}
.d{color:#ff5a52;text-decoration:underline;text-decoration-color:#e5251b;text-decoration-thickness:.045em;text-underline-offset:.1em}
.meta{position:absolute;left:72px;bottom:64px;display:flex;gap:28px;font-family:"Geist Mono";font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#9b9b98}
.meta b{font-weight:400;color:#f3f3f1}
.meta i{display:inline-block;width:9px;height:9px;background:#e5251b;margin-right:12px;vertical-align:1px}
svg.orb{position:absolute;right:-120px;top:40px;width:620px;height:620px}
</style></head><body>
<div id="card">
  <div class="brand">
    <svg width="40" height="29" viewBox="34 32 132 94"><path d="M40 118 H86 C96 118 104 112 108 102 L128 40 C112 66 98 86 74 102" fill="none" stroke="#f3f3f1" stroke-width="8" stroke-linecap="square"/><path d="M108 118 H150" stroke="#f3f3f1" stroke-width="8"/><rect x="150" y="112" width="12" height="12" fill="#e5251b"/></svg>
    <span>WIRE<span>SHARKS</span></span>
  </div>
  <h1>The world's most<br><span class="d">dangerous</span> AI.</h1>
  <div class="meta"><span><i></i><b>Raptor</b> Agent</span><span><b>Talon-1</b> Model</span><span>Dec 25, 2026</span></div>
  <svg class="orb" viewBox="-310 -310 620 620" id="orb"></svg>
</div>
<script>
const svg=document.getElementById('orb'),N=2600,R=280,ns='http://www.w3.org/2000/svg';
const tilt=0.35;
for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;let x=Math.cos(th)*r,z=Math.sin(th)*r;
 const yy=y*Math.cos(tilt)-z*Math.sin(tilt),zz=y*Math.sin(tilt)+z*Math.cos(tilt);
 const c=document.createElementNS(ns,'circle');c.setAttribute('cx',x*R);c.setAttribute('cy',yy*R);
 const front=(zz+1)/2;c.setAttribute('r',0.9+front*1.3);
 const red=(i*7919)%9<2;c.setAttribute('fill',red?'#e5251b':'#d4d4d2');c.setAttribute('opacity',(0.12+front*0.7).toFixed(2));svg.appendChild(c)}
const claws=["M12 4Q1.93 13.98 4 28Q8.57 16.19 12 4Z","M21 1Q9.41 13.87 12 31Q17.07 16.17 21 1Z","M29 5Q18.99 13.81 21 27Q25.56 16.21 29 5Z"];
const g=document.createElementNS(ns,'g');g.setAttribute('transform','translate(-170 -190) scale(11)');
claws.forEach((d,i)=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill',i==2?'#e5251b':'#111214');p.setAttribute('stroke',i==2?'#e5251b':'#3a3a3a');p.setAttribute('stroke-width','.12');g.appendChild(p)});
svg.appendChild(g);
</script></body></html>
